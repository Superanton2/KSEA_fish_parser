# Конфіг повного знімка (сервер). Скопіюйте в config.toml і впишіть contact_email.
lang = "uk"
db_path = "data/zakaz_fish.sqlite"
raw_dir = "data/raw"
out_dir = "data/out"
timeout_s = 30
max_pages_per_category = 100
user_agent = "KSEA-FishMarketResearch/0.2"   # перший токен не має містити fast, wget, fetch, doc... (robots.txt zakaz.ua)
contact_email = ""                 # заповнює користувач; додається в User-Agent, у базу знімка не пишеться
store_descriptions = false

[snapshot]
cities = ["kyiv", "odesa", "lviv", "kharkiv", "zhytomyr", "dnipro", "rivne",
          "chernivtsi", "vinnytsia", "poltava", "ivano-frankivsk", "kryvyi-rih"]
cities_extra = []                  # міста з discovered_cities.csv, додані вручну
city_probes = true                 # перевірити міста з довідника магазинів і зробити звіт
auto_include_discovered = false    # нові міста до знімка не додаються
max_city_probes = 150
baseline_cities = ["ivano-frankivsk", "kryvyi-rih"]   # міста-еталони «національного набору»

scopes = ["core", "canned", "snacks", "frozen", "semi"]
chains_exclude = ["masterzoo", "biotus"]   # зоотовари й добавки
chains_only = []                   # не порожній: лише ці мережі (для пілоту)
max_store_details = 0              # 0: без обмеження
storefront_listings = true
store_directory = true
store_details = true
details_max_age_days = 30          # свіжі картки не перезбираємо
# fish_keywords: за замовчуванням див. zakaz_fish/config.py (DEFAULT_FISH_KEYWORDS); можна перевизначити тут

# Підтаблиці йдуть ПІСЛЯ простих ключів секції (інакше TOML віднесе ключі до підтаблиці).
[snapshot.scope_roots]
core = "fish-and-seafood-zakaz"
canned = "canned-fish-zakaz"
snacks = "packed-fish-snacks-zakaz"
frozen = "frozen-fish-and-seafood-zakaz"
semi = "half-made-food-zakaz"

[snapshot.scope_filters]           # розділи, де зберігаються лише рядки з рибними назвами
semi = "fish_keywords"

[rate]
delay_min_s = 1.5
delay_max_s = 3.0
delay_floor_min_s = 1.0
delay_floor_max_s = 2.0
delay_ceiling_s = 60
speedup_after_ok = 300
slowdown_factor = 2.0
cooldown_base_s = 60
cooldown_max_s = 1800
breaker_window = 100
breaker_errors = 8
breaker_pause_s = 1200
breaker_max_trips = 3
breaker_trip_window_s = 10800
max_requests_per_hour = 2400

# Ручні уточнення, якщо автоматичний пошук рибних категорій вітрини не спрацював:
# [storefront_overrides.metro]
# core = "fish-and-seafood-metro"
